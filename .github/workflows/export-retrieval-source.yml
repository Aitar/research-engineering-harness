name: Export retrieval source

on:
  pull_request:
    branches: [agent/raise-coverage]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: tar --exclude=.git -czf /tmp/retrieval-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-source
          path: /tmp/retrieval-source.tar.gz
          if-no-files-found: error
