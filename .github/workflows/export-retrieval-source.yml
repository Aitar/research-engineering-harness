name: Apply retrieval implementation

on:
  pull_request:
    branches: [agent/raise-coverage]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import glob
          import hashlib

          expected_remote = {
              'chunk-00.b64': ('1a8d8eac7da22b36e5e03a69eb9fab2645e730c5ba12fa83366173b9dcefd9dd', 12000),
              'chunk-01.b64': ('837c6de8e114fdd156f55d22434f5c56781a29c8d0abcfcce814550417016a8a', 12000),
              'chunk-02.b64': ('f43207cf30b7bd68c06b7e0f2aa33c9507aa7c884bf317ecc3c2a45844f9ecbb', 12000),
              'chunk-03.b64': ('7c5729d7a8978faa1892b2bc671c097dd007d3a38ca480aab17c20de420fb0b2', 11999),
              'chunk-04.b64': ('1cdb7b91a1de1d197cab982e3eedc60b1ce82f56a8151bff9a8f084b078cb135', 12000),
              'chunk-05.b64': ('fc8b4f7b3d16436575016b40ee93f198f898229b947433a1cbdeb7848d4268ae', 8368),
          }
          paths = sorted(glob.glob('.retrieval-upload/chunk-*.b64'))
          assert [Path(path).name for path in paths] == list(expected_remote)
          chunks = []
          for path in paths:
              name = Path(path).name
              text = Path(path).read_text(encoding='utf-8')
              digest = hashlib.sha256(text.encode()).hexdigest()
              expected_digest, expected_length = expected_remote[name]
              assert len(text) == expected_length, (name, len(text), expected_length)
              assert digest == expected_digest, (name, digest, expected_digest)
              chunks.append(text)

          # Repair two connector-transfer discrepancies identified by byte-level comparison.
          chunks[0] = chunks[0][:9006] + 'C' + chunks[0][9007:]
          chunks[3] = chunks[3][:4778] + 'M' + chunks[3][4778:]
          encoded = ''.join(chunks)
          assert len(encoded) == 68368
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == '888f8683e4289af092dbc63bcff6a4509e6c8ef5e1d3f088489356593d7b4a60', digest
          Path('/tmp/retrieval-payload.tar.gz').write_bytes(payload)
          print('verified payload', digest)
          PY
      - name: Apply implementation and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/retrieval-payload.tar.gz -C .
          rm -rf .retrieval-upload
          rm -f .github/workflows/export-retrieval-source.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add grep-first hybrid retrieval'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
