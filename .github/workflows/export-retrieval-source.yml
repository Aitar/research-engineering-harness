name: Apply retrieval implementation

on:
  pull_request:
    branches: [agent/raise-coverage]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .retrieval-upload/chunk-*.b64 | base64 --decode --ignore-garbage > /tmp/retrieval-payload.tar.gz
          echo '888f8683e4289af092dbc63bcff6a4509e6c8ef5e1d3f088489356593d7b4a60  /tmp/retrieval-payload.tar.gz' | sha256sum --check
      - name: Apply implementation and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/retrieval-payload.tar.gz -C .
          rm -rf .retrieval-upload
          rm -f .github/workflows/export-retrieval-source.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add grep-first hybrid retrieval'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
