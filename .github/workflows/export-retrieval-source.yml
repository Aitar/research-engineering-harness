name: Apply retrieval implementation

on:
  pull_request:
    branches: [agent/raise-coverage]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c .retrieval-upload/chunk-*.b64
          sha256sum .retrieval-upload/chunk-*.b64
          python - <<'PY'
          from pathlib import Path
          import base64
          import glob
          import hashlib

          paths = sorted(glob.glob('.retrieval-upload/chunk-*.b64'))
          encoded = ''.join(Path(path).read_text(encoding='utf-8') for path in paths)
          print('encoded_length', len(encoded), 'mod4', len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          Path('/tmp/retrieval-payload.tar.gz').write_bytes(payload)
          print('payload_sha256', hashlib.sha256(payload).hexdigest())
          PY
          echo '888f8683e4289af092dbc63bcff6a4509e6c8ef5e1d3f088489356593d7b4a60  /tmp/retrieval-payload.tar.gz' | sha256sum --check
      - name: Apply implementation and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/retrieval-payload.tar.gz -C .
          rm -rf .retrieval-upload
          rm -f .github/workflows/export-retrieval-source.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add grep-first hybrid retrieval'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
