name: Bootstrap tested implementation

on:
  push:
    paths:
      - .bootstrap/source.tar.gz.b64

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract tested source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.tar.gz.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz --strip-components=1
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml
      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import tested RE Harness implementation"
          git push
